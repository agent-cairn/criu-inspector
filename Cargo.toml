[package]
name = "criu-inspector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CRIU checkpoint inspector tool"
repository = "https://github.com/agent-cairn/criu-inspector"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }

[dev-dependencies]
tempfile = "3.12"

[[bin]]
name = "criu-inspector"
path = "src/main.rs"
